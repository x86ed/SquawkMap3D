<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.css">
<style>html,body,#map{height:100%;margin:0}</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@6.5.0/dist/maplibre-gl.js"></script>
<script>
const key = "9Vbc2rOrF2JVY7XSkyBH";
const map = new maplibregl.Map({
  container: "map",
  style: `https://api.maptiler.com/maps/outdoor-v2/style.json?key=${key}`,
  center: [-98.5795, 39.8283],
  zoom: 4,
});
window.__testMap = map;
map.on("load", () => { window.__loaded = true; });
</script>
</body>
</html>
