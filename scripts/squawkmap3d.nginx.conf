# Replaces nginx:alpine's default server block. Needed because the base
# image's default mime.types has no entry for .mjs, so ES module scripts
# (MapLibre's worker: components/map/MapView.tsx's setWorkerUrl call loads
# /maplibre-gl-worker.mjs as a module script) were served as
# application/octet-stream, which browsers reject under strict MIME
# checking for module scripts — discovered on the real deploy, see
# openspec/changes/deploy-to-feeder/design.md's Risks for the writeup.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.mjs$ {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
