# Replaces nginx:alpine's default server block. Needed because the base
# image's default mime.types has no entry for .mjs, so ES module scripts
# (MapLibre's worker: components/map/MapView.tsx's setWorkerUrl call loads
# /maplibre-gl-worker.mjs as a module script) were served as
# application/octet-stream, which browsers reject under strict MIME
# checking for module scripts — discovered on the real deploy, see
# openspec/changes/deploy-to-feeder/design.md's Risks for the writeup.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # Proxies the feeder's receiver.json server-side so the browser sees a
    # same-origin request. Needed because ultrafeeder's nginx only patches
    # CORS onto aircraft.json's location block (docker-tar1090's
    # 07-nginx-configure), not receiver.json — a direct cross-origin browser
    # fetch against it is blocked. host.docker.internal:8080 reaches the
    # ultrafeeder container's published port from this sidecar container
    # (requires --add-host=host.docker.internal:host-gateway on `docker run`,
    # see deploy-to-feeder.sh).
    location = /data/receiver.json {
        proxy_pass http://host.docker.internal:8080/data/receiver.json;
        proxy_set_header Host $host;
    }

    # Same CORS gap as receiver.json above: ultrafeeder's nginx only patches
    # aircraft.json's location block (docker-tar1090's 07-nginx-configure),
    # so outline.json (readsb's actual-range-outline file, see
    # components/map/rangeOutline.ts) is also proxied server-side to make
    # the browser fetch same-origin.
    location = /data/outline.json {
        proxy_pass http://host.docker.internal:8080/data/outline.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
